<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Review inbox</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><span class="eyebrow">LOCAL REVIEW</span><h1>Your review inbox</h1><p>Questions and decisions, one case at a time.</p><div id="connection" role="status">Connecting…</div><label><input type="checkbox" id="sound"> Play a sound when a new review arrives (off unless enabled)</label></header>
<main><aside><h2>Cases <span id="count">0</span></h2><div id="cases"></div></aside><section id="detail"><div class="empty"><h2>Nothing to review yet</h2><p>Ready requests will appear here automatically.</p></div></section></main>
<footer>Answers are saved before the runner receives them. “Continuing” appears only after verified runtime acknowledgement.</footer></body></html>
